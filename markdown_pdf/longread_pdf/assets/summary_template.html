<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{BASE_URL}}">
  <title>{{TITLE}}</title>
  <style>{{CSS}}</style>
</head>
<body class="mode-{{MODE}} summary-output {{OUTPUT_CLASS}}" data-running-title="{{SHORT_TITLE}}">
  <!--
  THESIS: Editorial compression becomes visible structure; refuse the generic AI dashboard.
  OWN-WORLD: Cool paper gray, white proof sheet, graphite type, cinnabar evidence marks, hairline seams.
  STORY: Add a source, choose editorial depth, generate and share a numbered reader-question brief.
  FIRST VIEWPORT: Compact controls support a dominant result proof; the primary action stays obvious.
  FORM: Policy-briefing workbench, grounded direction 4, seed 1683501c.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <main class="summary-shell">
    <header class="summary-header">
      <h1>{{TITLE}}</h1>
      {{SUMMARY_META}}
    </header>
    <article class="longread">{{CONTENT}}</article>
  </main>
</body>
</html>
