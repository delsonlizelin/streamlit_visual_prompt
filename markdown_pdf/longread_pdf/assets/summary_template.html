<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{BASE_URL}}">
  <title>{{TITLE}}</title>
  <style>{{CSS}}</style>
</head>
<body class="mode-{{MODE}} summary-output {{OUTPUT_CLASS}}" data-running-title="{{SHORT_TITLE}}">
  <main class="summary-shell">
    <header class="summary-header">
      <p class="summary-kicker">文章摘要</p>
      <h1>{{TITLE}}</h1>
    </header>
    <article class="longread">{{CONTENT}}</article>
    <footer class="summary-footer">阅读摘要 · {{DATE}}</footer>
  </main>
</body>
</html>
